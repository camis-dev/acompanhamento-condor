<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorias Performance — Acompanhamento Condor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div class="content">
      <div id="topbarSlot"></div>

  <div id="scoreboardCard"></div>

  <div class="section-title">Composição do faturamento <span class="tag">participação por categoria</span></div>
  <div class="card" id="stackBarCard"></div>

  <div class="section-title">Detalhamento por categoria <span class="tag">Higiene · Limpeza · Beleza</span></div>
  <div class="tabs" id="tabs"></div>
  <div id="tabpanels"></div>

  <div class="section-title">Ranking por supervisor <span class="tag">Higiene + Limpeza + Beleza</span></div>
  <div class="card" id="rankCard"></div>

  <div class="footer-note">Positivação aqui conta clientes distintos que compraram o item no período, excluindo quem teve devolução — mesmo critério do Condor Geral.</div>
    </div>
  </div>
</div>

<script src="meses.js"></script>
<script src="mes-loader.js"></script>
<script src="script.js"></script>
<script>
(function () {
  var data = getData();
  document.getElementById("sidebarSlot").outerHTML = sidebarHTML("categorias", { exportFn: "exportCategoriasXls" });
  document.getElementById("topbarSlot").outerHTML = topbarHTML(
    "Categorias Performance",
    "Higiene · Limpeza · Beleza — venda faturada e positivação, sem meta oficial (apenas acompanhamento)",
    data.atualizadoEm
  );
  var cat = data.categorias;

  var scoreboardRows = cat.lista.map(function (c) {
    return '<div class="scoreboard-row" style="--cat-accent:' + catAccent(c.id) + '">' +
      '<div class="scoreboard-name"><span class="dot"></span>' + c.nome + '</div>' +
      '<div class="scoreboard-venda">' + fmtBRLCentavos(c.totalGeral.faturamento) + '</div>' +
      '<div class="scoreboard-posit">' + fmtInt(c.totalGeral.positivacao) + '</div>' +
    '</div>';
  }).join("");
  scoreboardRows += '<div class="scoreboard-row scoreboard-total">' +
    '<div class="scoreboard-name">Total</div>' +
    '<div class="scoreboard-venda">' + fmtBRLCentavos(cat.totalGeral.faturamento) + '</div>' +
    '<div class="scoreboard-posit">' + fmtInt(cat.totalGeral.positivacao) + '</div>' +
  '</div>';
  document.getElementById("scoreboardCard").innerHTML =
    '<div class="scoreboard">' +
      '<div class="scoreboard-head"><div class="scoreboard-title">Categorias Performance</div><div class="scoreboard-sub">Acompanhamento do período</div></div>' +
      '<div class="scoreboard-body">' +
        '<div class="scoreboard-cols"><span></span><span>Venda</span><span>Positivação</span></div>' +
        scoreboardRows +
      '</div>' +
    '</div>';

  document.getElementById("stackBarCard").innerHTML = stackBarHTML(cat.lista.map(function (c) {
    return { label: c.nome, value: c.totalGeral.faturamento, valueText: fmtBRL(c.totalGeral.faturamento), colorVar: catAccent(c.id) };
  }));

  document.getElementById("tabs").innerHTML = cat.lista.map(function (c, i) {
    return '<button class="tab-btn' + (i === 0 ? ' active' : '') + '" data-tab="panel-' + c.id + '" style="--tab-accent:' + catAccent(c.id) + '">' + c.nome + '</button>';
  }).join("");

  document.getElementById("tabpanels").innerHTML = cat.lista.map(function (c, i) {
    var produtosHtml = c.produtos.map(function (p) { return '<span class="prodchip"><b>' + p.codigo + '</b> ' + p.descricao + '</span>'; }).join("");
    var supHtml = c.porSupervisor.map(function (s) {
      var vendHtml = "";
      if (s.vendedores && s.vendedores.length) {
        vendHtml = '<div style="margin-top:12px">' + s.vendedores.slice().sort(function(a,b){return b.faturamento-a.faturamento;}).map(function (v) {
          return '<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)">' +
            '<span>' + v.nome + '</span><span class="num">' + fmtBRLCentavos(v.faturamento) + ' · ' + v.positivacao + ' clientes</span>' +
          '</div>';
        }).join("") + '</div>';
      } else {
        vendHtml = '<div style="font-size:12px;color:var(--ink-muted);margin-top:8px">Nenhuma venda desta categoria por vendedores deste time no período.</div>';
      }
      return '<div class="card sup-card clickable" style="--sup-accent:' + supAccent(s.supervisorId) + '" onclick="toggleSupCard(this)">' +
        '<div class="sup-head"><div class="sup-name"><span class="dot"></span>' + s.nome + '</div><div style="display:flex;align-items:center;gap:14px"><span class="num" style="font-weight:800">' + fmtBRL(s.faturamento) + '</span><span class="chev">▶</span></div></div>' +
        '<div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Positivação: ' + fmtInt(s.positivacao) + ' clientes (' + s.positivacaoFaturado + 'F + ' + s.positivacaoAFaturar + 'AF)</div>' +
        '<div class="sup-body">' + metricTableHTML(s, { caixas: true, unidades: false, meta: false }) + vendHtml + '</div>' +
      '</div>';
    }).join("");

    return '<div class="tabpanel' + (i === 0 ? ' active' : '') + '" id="panel-' + c.id + '">' +
      '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
          '<div><div style="font-size:17px;font-weight:800">' + c.nome + '</div><div style="font-size:11.5px;color:var(--ink-muted)">' + c.departamento + ' · ' + c.totalSkus + ' SKUs</div></div>' +
          '<button class="btn ghost" onclick="var el=this.parentElement.parentElement.querySelector(\'.prodlist\'); el.style.display = el.style.display===\'none\'?\'flex\':\'none\';">Ver produtos da categoria</button>' +
        '</div>' +
        '<div class="prodlist" style="display:none">' + produtosHtml + '</div>' +
        '<div style="margin-top:12px">' + metricTableHTML(c.totalGeral, { caixas: true, unidades: true, meta: false }) + '</div>' +
      '</div>' +
      '<div class="section-title" style="margin-top:20px">Por supervisor</div>' +
      supHtml +
    '</div>';
  }).join("");

  var comFaturamento = cat.porSupervisor.slice().filter(function (s) { return s.faturamento > 0 || s.aFaturar > 0; }).sort(function (a, b) { return b.faturamento - a.faturamento; });
  var maxFat = comFaturamento.reduce(function (m, x) { return Math.max(m, x.faturamento); }, 0) || 1;
  document.getElementById("rankCard").innerHTML = rankChartHTML(comFaturamento.map(function (s) {
    return {
      nome: s.nome,
      accentVar: supAccent(s.supervisorId),
      pct: s.faturamento / maxFat * 100,
      valorTexto: fmtBRL(s.faturamento),
      valorSub: fmtInt(s.positivacao) + " clientes"
    };
  }));

  wireTabs(document);
})();

function exportCategoriasXls() {
  var data = getData();
  var cat = data.categorias;
  var headers = ["Categoria", "Supervisor", "Faturado", "A Faturar", "Faturamento", "Caixas Vendidas", "Positivação Faturado", "Positivação A Faturar", "Positivação"];
  var rows = [];
  cat.lista.forEach(function (c) {
    c.porSupervisor.forEach(function (s) {
      rows.push([c.nome, s.nome, fmtBRLCentavos(s.faturado), fmtBRLCentavos(s.aFaturar), fmtBRLCentavos(s.faturamento), fmtNum(s.caixasVenda, 2), s.positivacaoFaturado, s.positivacaoAFaturar, s.positivacao]);
    });
    rows.push([c.nome, "TOTAL CATEGORIA", fmtBRLCentavos(c.totalGeral.faturado), fmtBRLCentavos(c.totalGeral.aFaturar), fmtBRLCentavos(c.totalGeral.faturamento), fmtNum(c.totalGeral.caixasVenda, 2), c.totalGeral.positivacaoFaturado, c.totalGeral.positivacaoAFaturar, c.totalGeral.positivacao]);
  });
  rows.push(["TOTAL GERAL", "", fmtBRLCentavos(cat.totalGeral.faturado), fmtBRLCentavos(cat.totalGeral.aFaturar), fmtBRLCentavos(cat.totalGeral.faturamento), fmtNum(cat.totalGeral.caixasVenda, 2), cat.totalGeral.positivacaoFaturado, cat.totalGeral.positivacaoAFaturar, cat.totalGeral.positivacao]);
  downloadHtmlAsXls("Condor Categorias", headers, rows, "Condor Categorias Performance.xls");
}
</script>
</body>
</html>
