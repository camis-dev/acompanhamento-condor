<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visão Geral — Acompanhamento Condor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="sidebarSlot"></div>
  <div class="main">
    <div class="content">
      <div id="topbarSlot"></div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="split2">
        <div class="card">
          <div class="totalcard-title">Total Geral Condor</div>
          <div id="totalTable"></div>
          <div id="totalMeters" style="margin-top:14px"></div>
          <div class="footer-note" id="totalMetaNote" style="margin-top:10px;text-align:left"></div>
        </div>
        <div class="card donut-card">
          <div class="donut-card-title">Desempenho Geral</div>
          <div class="donut-wrap" id="donutWrap"></div>
          <div class="donut-legend" id="donutLegend"></div>
          <div class="meta-box-row" id="metaBoxRow"></div>
        </div>
      </div>

      <div class="section-title">Ranking por supervisor <span class="tag">Faturamento líquido</span></div>
      <div class="card" id="rankCard"></div>

      <div class="split2" style="grid-template-columns:1.6fr 1fr">
        <div>
          <div class="section-title" style="margin-top:0">Detalhamento por supervisor</div>
          <div id="supervisores"></div>
        </div>
        <div id="insightsSlot"></div>
      </div>

      <div class="footer-note">Devolução deduzida do faturado; Faturado + A Faturar sempre soma o total exibido (sem duplicidade de cliente entre as duas colunas). Positivação exclui cliente com devolução no período.</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
(function () {
  var data = getData();
  var g = data.geral.totalGeral;

  document.getElementById("sidebarSlot").outerHTML = sidebarHTML("geral", { exportFn: "exportGeralXls" });
  document.getElementById("topbarSlot").outerHTML = topbarHTML(
    "Visão Geral · Condor",
    "Faturado, a faturar, caixas vendidas e positivação — meta cascateada por supervisor e vendedor",
    data.atualizadoEm
  );

  // Sparkline de cada KPI = valor por supervisor (ordem fixa de data.supervisores) -- dado real, nao decorativo.
  var supOrder = data.supervisores.map(function (s) {
    var sup = data.geral.porSupervisor.find(function (x) { return x.supervisorId === s.id; });
    return sup || { faturamento: 0, faturado: 0, aFaturar: 0, caixasVenda: 0, positivacao: 0 };
  });
  function serie(field) { return supOrder.map(function (s) { return s[field]; }); }

  document.getElementById("statGrid").innerHTML = [
    { label: "Faturamento (líquido)", value: fmtBRL(g.faturamento), vsMeta: fmtPct(g.pctMetaFaturamento), accent: "var(--condor-3)", icon: iconMoney(), spark: sparklineSVG(serie("faturamento"), "var(--condor-3)") },
    { label: "Faturado", value: fmtBRL(g.faturado), vsMeta: fmtPct(g.pctMetaFaturamento), accent: "var(--good)", icon: iconTrendUp(), spark: sparklineSVG(serie("faturado"), "var(--good)") },
    { label: "A Faturar", value: fmtBRL(g.aFaturar), vsMeta: fmtPct(g.pctMetaFaturamento), accent: "var(--warning)", icon: iconClock(), spark: sparklineSVG(serie("aFaturar"), "var(--warning)") },
    { label: "Caixas vendidas", value: fmtNum(g.caixasVenda, 0), vsMeta: fmtPct(g.pctMetaPositivacao), accent: "var(--purple)", icon: iconBox(), spark: sparklineSVG(serie("caixasVenda"), "var(--purple)") },
    { label: "Positivação", value: fmtInt(g.positivacao) + " clientes", vsMeta: fmtPct(g.pctMetaPositivacao), accent: "var(--sup-100)", icon: iconPeople(), spark: sparklineSVG(serie("positivacao"), "var(--sup-100)") }
  ].map(statTileHTML).join("");

  document.getElementById("totalTable").innerHTML = metricTableHTML(g, { caixas: true, unidades: true, meta: false });
  document.getElementById("totalMeters").innerHTML = meterRow("Faturamento", g.pctMetaFaturamento) + meterRow("Positivação", g.pctMetaPositivacao);
  document.getElementById("totalMetaNote").textContent = "Meta faturamento: " + fmtBRL(g.metaFaturamento) + "  ·  Meta positivação: " + fmtInt(g.metaPositivacao) + " clientes";

  var falta = Math.max(0, g.metaFaturamento - g.faturamento);
  var pctAtingido = Math.min(100, g.pctMetaFaturamento);
  var pctFalta = Math.max(0, 100 - pctAtingido);
  document.getElementById("donutWrap").innerHTML =
    donutSVG(pctAtingido, "var(--condor-3)", "var(--line)") +
    '<div class="donut-center"><div class="pct num">' + fmtPct(g.pctMetaFaturamento) + '</div><div class="lbl">da meta<br>atingida</div></div>';
  document.getElementById("donutLegend").innerHTML =
    '<div class="donut-legend-item"><span class="sw" style="background:var(--condor-3)"></span><div class="lbl-wrap">Faturado<span class="sub-v num">' + fmtBRL(g.faturamento) + '</span></div><span class="pct-v num">' + fmtPct(pctAtingido) + '</span></div>' +
    '<div class="donut-legend-item"><span class="sw" style="background:var(--line)"></span><div class="lbl-wrap">Falta p/ meta<span class="sub-v num">' + fmtBRL(falta) + '</span></div><span class="pct-v num">' + fmtPct(pctFalta) + '</span></div>';
  document.getElementById("metaBoxRow").innerHTML =
    '<div class="meta-box"><div class="k">Meta de faturamento</div><div class="v num">' + fmtBRL(g.metaFaturamento) + '</div></div>' +
    '<div class="meta-box"><div class="k">Faltam</div><div class="v warn num">' + fmtBRL(falta) + '</div></div>';

  var order = data.supervisores;
  var comFaturamento = order.map(function (s) {
    var sup = data.geral.porSupervisor.find(function (x) { return x.supervisorId === s.id; });
    return { id: s.id, nome: s.nome, sup: sup };
  }).filter(function (x) { return x.sup; }).sort(function (a, b) { return b.sup.faturamento - a.sup.faturamento; });
  var maxFat = comFaturamento.reduce(function (m, x) { return Math.max(m, x.sup.faturamento); }, 0) || 1;
  document.getElementById("rankCard").innerHTML = rankChartHTML(comFaturamento.map(function (x) {
    return {
      nome: x.nome,
      accentVar: supAccent(x.id),
      pct: x.sup.faturamento / maxFat * 100,
      valorTexto: fmtBRL(x.sup.faturamento),
      valorSub: fmtInt(x.sup.positivacao) + " clientes"
    };
  }));

  document.getElementById("supervisores").innerHTML = order.map(function (s) {
    var sup = data.geral.porSupervisor.find(function (x) { return x.supervisorId === s.id; });
    if (!sup) return "";
    var vendedoresHtml = "";
    if (sup.vendedores && sup.vendedores.length) {
      vendedoresHtml = '<div style="margin-top:14px"><div style="font-size:11.5px;font-weight:800;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px">Por vendedor (' + sup.vendedores.length + ')</div>' +
        sup.vendedores.slice().sort(function (a, b) { return b.faturamento - a.faturamento; }).map(function (v) {
          return '<div style="padding:10px 0;border-top:1px solid var(--line)">' +
            '<div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px"><span>' + v.nome + ' <span style="color:var(--ink-muted);font-weight:500">(#' + v.codVend + ')</span></span><span class="num">' + fmtBRL(v.faturamento) + '</span></div>' +
            '<div style="display:flex;gap:18px;margin-top:6px;flex-wrap:wrap">' +
              '<div style="flex:1;min-width:200px">' + meterRow("Faturamento", v.pctMetaFaturamento) + '</div>' +
              '<div style="flex:1;min-width:200px">' + meterRow("Positivação", v.pctMetaPositivacao) + '</div>' +
            '</div>' +
            '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:2px">Faturado ' + fmtBRLCentavos(v.faturado) + ' · A Faturar ' + fmtBRLCentavos(v.aFaturar) + ' · Caixas ' + fmtNum(v.caixasVenda,1) + ' · Positivação ' + v.positivacaoFaturado + 'F + ' + v.positivacaoAFaturar + 'AF = ' + v.positivacao + '</div>' +
          '</div>';
        }).join("") +
      '</div>';
    }
    return '<div class="card sup-card clickable" style="--sup-accent:' + supAccent(s.id) + '" onclick="toggleSupCard(this)">' +
      '<div class="sup-head">' +
        '<div class="sup-name"><span class="dot"></span>' + s.nome + '</div>' +
        '<div style="display:flex;align-items:center;gap:14px">' +
          '<span class="num" style="font-weight:800">' + fmtBRL(sup.faturamento) + '</span>' +
          '<span class="chev">▶</span>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:18px;margin-top:10px;flex-wrap:wrap">' +
        '<div style="flex:1;min-width:220px">' + meterRow("Faturamento", sup.pctMetaFaturamento) + '</div>' +
        '<div style="flex:1;min-width:220px">' + meterRow("Positivação", sup.pctMetaPositivacao) + '</div>' +
      '</div>' +
      '<div class="sup-body">' + metricTableHTML(sup, { caixas: true, unidades: true, meta: false }) + vendedoresHtml + '</div>' +
    '</div>';
  }).join("");

  var faltaClientes = Math.max(0, Math.round(g.metaPositivacao - g.positivacao));
  var pctAFaturar = g.faturamento ? (g.aFaturar / g.faturamento * 100) : 0;
  var insights = [];
  insights.push({
    icon: iconTarget(),
    html: g.pctMetaFaturamento >= 100
      ? "Meta de faturamento batida! Você atingiu <b>" + fmtPct(g.pctMetaFaturamento) + "</b> do objetivo."
      : "Você já atingiu <b>" + fmtPct(g.pctMetaFaturamento) + "</b> da meta de faturamento. Faltam <b>" + fmtBRL(falta) + "</b> para bater a meta."
  });
  insights.push({
    icon: iconPeople(),
    html: g.pctMetaPositivacao >= 100
      ? "Meta de positivação batida! <b>" + fmtInt(g.positivacao) + "</b> clientes positivados."
      : "A positivação está em <b>" + fmtPct(g.pctMetaPositivacao) + "</b> da meta. Faltam <b>" + fmtInt(faltaClientes) + "</b> clientes para atingir o objetivo."
  });
  insights.push({
    icon: iconClock(),
    html: "O valor a faturar representa <b>" + fmtPct(pctAFaturar) + "</b> do total. Acompanhe de perto para garantir o resultado."
  });
  document.getElementById("insightsSlot").innerHTML = insightsCardHTML(insights, { ctaHref: "#supervisores", ctaLabel: "Ver detalhamento por supervisor" });
})();

function exportGeralXls() {
  var data = getData();
  var headers = ["Supervisor", "Faturado", "A Faturar", "Faturamento", "Meta Fat.", "% Meta Fat.", "Caixas Vendidas", "Positivação Faturado", "Positivação A Faturar", "Positivação", "Meta Posit.", "% Meta Posit."];
  var rows = data.geral.porSupervisor.map(function (s) {
    return [s.nome, fmtBRLCentavos(s.faturado), fmtBRLCentavos(s.aFaturar), fmtBRLCentavos(s.faturamento), s.metaFaturamento ? fmtBRLCentavos(s.metaFaturamento) : "", s.pctMetaFaturamento ? fmtPct(s.pctMetaFaturamento) : "", fmtNum(s.caixasVenda,2), s.positivacaoFaturado, s.positivacaoAFaturar, s.positivacao, s.metaPositivacao || "", s.pctMetaPositivacao ? fmtPct(s.pctMetaPositivacao) : ""];
  });
  var g = data.geral.totalGeral;
  rows.push(["TOTAL GERAL", fmtBRLCentavos(g.faturado), fmtBRLCentavos(g.aFaturar), fmtBRLCentavos(g.faturamento), fmtBRLCentavos(g.metaFaturamento), fmtPct(g.pctMetaFaturamento), fmtNum(g.caixasVenda,2), g.positivacaoFaturado, g.positivacaoAFaturar, g.positivacao, g.metaPositivacao, fmtPct(g.pctMetaPositivacao)]);
  downloadHtmlAsXls("Condor Geral", headers, rows, "Condor Geral - por supervisor.xls");
}
</script>
</body>
</html>
