<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento Condor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brandrow">
        <div class="logo-slot">Triunfante</div>
        <span class="brand-x">×</span>
        <div class="logo-slot">Condor</div>
      </div>
      <div class="hero-meta">Atualizado em <span id="atualizadoEm">—</span></div>
    </div>
    <h1>Acompanhamento Condor</h1>
    <div class="sub">O que você quer ver?</div>
  </div>
</div>

<div class="wrap">
  <div class="menu-grid" id="menuGrid" style="margin-top:26px"></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
(function () {
  var data = getData();
  document.getElementById("atualizadoEm").textContent = new Date(data.atualizadoEm).toLocaleString("pt-BR");

  var g = data.geral.totalGeral;
  var cats = data.categorias.totalGeral;
  var cdm = data.casaDeMae.totalGeral;

  var itens = [
    {
      href: "visao-geral.html", accent: "var(--condor-2)", tag: "Fornecedor 35116 · todos os produtos",
      titulo: "Visão Geral", desc: "Faturado, a faturar, caixas vendidas e positivação por supervisor e vendedor, com metas e percentuais.",
      stats: [
        { v: fmtBRL(g.faturamento), k: "Faturamento" },
        { v: fmtInt(g.positivacao), k: "Clientes positivados" }
      ]
    },
    {
      href: "categorias.html", accent: "var(--sup-24)", tag: "Higiene · Limpeza · Beleza",
      titulo: "Categorias Performance", desc: "Venda faturada e positivação das 3 categorias foco, por supervisor — sem meta oficial, só acompanhamento.",
      stats: [
        { v: fmtBRL(cats.faturamento), k: "Faturamento" },
        { v: fmtInt(cats.positivacao), k: "Clientes positivados" }
      ]
    },
    {
      href: "casa-de-mae.html", accent: "var(--sup-27)", tag: "Rede Italo · 6 CNPJs",
      titulo: "Casa de Mãe", desc: "Linha Casa de Mãe vendida para os CNPJs da Rede Italo, com exportação no padrão exato da planilha.",
      stats: [
        { v: cdm.clientesAtivos + "/" + cdm.clientesRede, k: "Lojas ativas" },
        { v: fmtBRL(cdm.faturamento), k: "Faturamento" }
      ]
    }
  ];

  document.getElementById("menuGrid").innerHTML = itens.map(function (it) {
    return '<a class="menu-card" href="' + it.href + '" style="--menu-accent:' + it.accent + '">' +
      '<div class="menu-tag">' + it.tag + '</div>' +
      '<h2>' + it.titulo + '</h2>' +
      '<p>' + it.desc + '</p>' +
      '<div class="menu-stats">' + it.stats.map(function (s) {
        return '<div class="stat-inline"><div class="v num">' + s.v + '</div><div class="k">' + s.k + '</div></div>';
      }).join("") + '</div>' +
      '<div class="menu-arrow">→</div>' +
    '</a>';
  }).join("");
})();
</script>
</body>
</html>
